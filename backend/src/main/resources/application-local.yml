spring:
  datasource:
    url: jdbc:h2:mem:studentai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      password:

ai:
  openai:
    api-key: mock-key
    api-url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
